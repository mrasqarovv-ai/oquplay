name: Verify OquPlay
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: oquplay
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: oquplay_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U oquplay -d oquplay_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://oquplay:ci_only@localhost:5432/oquplay_test
      TEST_DATABASE_URL: postgresql://oquplay:ci_only@localhost:5432/oquplay_test
      WEB_ORIGIN: http://localhost:3001
      LLM_MODE: demo
      EXPO_NO_TELEMETRY: "1"
      STATIC_WEB_DIR: ../mobile/dist
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm run db:migrate
      - run: npm test
      - run: npm run build:web
      - run: npx playwright install --with-deps chromium
      - run: |
          npm run start -w @oquplay/api > /tmp/oquplay-api.log 2>&1 &
          oquplay_ready=false
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:3001/api/health; then
              oquplay_ready=true
              break
            fi
            sleep 1
          done
          if [ "$oquplay_ready" != true ]; then
            cat /tmp/oquplay-api.log
            exit 1
          fi
          npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-traces
          path: test-results/
