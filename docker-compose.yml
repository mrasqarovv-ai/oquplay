services:
  db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: oquplay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_only}
      POSTGRES_DB: oquplay
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - oquplay-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oquplay"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  oquplay-db:
